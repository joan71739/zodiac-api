# ===========================
# 資料庫設定
# ===========================
spring.datasource.url=jdbc:postgresql://localhost:5432/zodiac
spring.datasource.username=your_username
spring.datasource.password=your_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Schema 初始化（開發用，正式環境請關閉）
# spring.sql.init.mode=always
# spring.sql.init.schema-locations=classpath:schema.sql

# ===========================
# 檔案上傳設定
# ===========================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 星盤圖片存放路徑
app.chart-image.upload-dir=uploads/charts/

# ===========================
# Claude AI API
# ===========================
anthropic.api.key=your_api_key_here
anthropic.api.url=https://api.anthropic.com/v1/messages
anthropic.api.model=claude-sonnet-4-20250514
anthropic.api.max-tokens=2048

# ===========================
# 備份設定
# ===========================
app.backup.dir=backups/
app.backup.db-name=zodiac
app.backup.db-host=localhost
app.backup.db-port=5432
app.backup.db-user=your_username

# ===========================
# 應用程式設定
# ===========================
server.port=8080
spring.application.name=zodiac-api
